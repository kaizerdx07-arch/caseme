<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#17171c;background:#fff}button,input,select{font:inherit}button{cursor:pointer}:root{--p:#6545e8;--pink:#ed9ac8;--line:#e6e6ed;--soft:#f7f7fa;--muted:#777780}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:28px;position:sticky;top:0;background:#fff;z-index:50}.logo{font-weight:900;font-size:20px}.nav{display:flex;gap:22px;flex:1;justify-content:center}.nav a{font-size:12px;color:#222;text-decoration:none}.nav a:hover{color:var(--p)}.icons{display:flex;gap:13px}.icons button{border:0;background:none;font-size:18px}.count{font-size:9px;background:#ef4c61;color:#fff;border-radius:10px;padding:2px 5px;position:relative;top:-8px;left:-6px}main{max-width:1280px;margin:auto;padding:22px 24px 60px}.hero{height:330px;border-radius:18px;background:linear-gradient(110deg,#eef0ff,#eadfff 55%,#f7e4f2);display:grid;grid-template-columns:52% 48%;overflow:hidden;padding:34px 38px}.hero h1{font-size:43px;line-height:1.04;margin:10px 0}.hero p{color:#555;max-width:520px}.tag{font-size:11px;font-weight:800;color:var(--p);letter-spacing:1.2px}.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:750}.primary{background:var(--p);color:#fff}.outline{background:#fff;border:1px solid var(--line)}.hero-cases{display:flex;align-items:center;justify-content:center;gap:12px;transform:rotate(-4deg);padding-top:25px}.phonecase{width:112px;height:224px;position:relative;filter:drop-shadow(0 18px 17px rgba(0,0,0,.22));transform:rotate(-2deg)}.phonecase.large{width:245px;height:490px}.shell{position:absolute;inset:0;border-radius:29px;background:linear-gradient(140deg,#575961,#101116 27%,#45474d 68%,#0d0e11);padding:4px}.large .shell{border-radius:59px;padding:8px}.inner{position:relative;width:100%;height:100%;border-radius:25px;overflow:hidden;background:#eee;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 9px 0 16px rgba(255,255,255,.08),inset -8px 0 16px rgba(0,0,0,.14)}.large .inner{border-radius:51px}.art{position:absolute;inset:0}.glare{position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.4),transparent 23%,transparent 63%,rgba(255,255,255,.12));mix-blend-mode:screen}.camera{position:absolute;z-index:5;left:7px;top:7px;width:48px;height:57px;border-radius:14px;background:linear-gradient(145deg,#303136,#090a0c);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;box-shadow:0 5px 10px #0007,inset 0 0 0 1px #686a70}.large .camera{left:14px;top:14px;width:94px;height:112px;border-radius:26px;padding:12px;gap:7px}.lens{border-radius:50%;background:radial-gradient(circle at 35% 25%,#b7d0e2 0 6%,#22303c 16%,#07090c 48%,#333941 54%,#050608 72%);border:1px solid #777}.flash{border-radius:50%;background:#e7dfad;border:1px solid #888}.print{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;font-weight:900;font-size:15px;padding:35px 8px;color:#fff;text-shadow:0 2px 6px #0008}.large .print{font-size:31px;padding:80px 20px}.products{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.product{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.pv{height:245px;background:#f7f7f8;display:grid;place-items:center}.pv img{height:238px;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 12px 10px rgba(0,0,0,.16))}.pb{padding:12px}.price{font-weight:850}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tiny{padding:7px 9px;font-size:10px}.small{font-size:10px;color:#777}.muted{color:#777780}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}.models{display:flex;gap:6px;flex-wrap:wrap}.modelBtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:10px}.modelBtn.active{border-color:var(--p);color:var(--p);background:#f6f3ff}.notice{border:1px solid var(--line);background:#fafafd;border-radius:12px;padding:12px;font-size:10px}.caseCollection{margin-top:30px}.collectionFrame{background:#fafafd;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}.collectionFrame img{max-width:100%;height:auto}.collectionMeta{display:flex;justify-content:space-between;margin-top:8px}.customBanner{margin:26px 0;padding:22px;border-radius:14px;background:linear-gradient(100deg,#17171c,#40374d);color:#fff;display:flex;justify-content:space-between;align-items:center}.toolbar{display:flex;justify-content:flex-end;margin-bottom:12px}.select,.input{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.shopgrid{display:grid;grid-template-columns:190px 1fr;gap:18px}.side{border:1px solid var(--line);border-radius:12px;padding:14px;height:max-content}.filter{margin-bottom:18px;font-size:10px}.filter b{display:block;margin-bottom:8px}.filter label{display:block;margin:7px 0}.customgrid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{border:1px solid var(--line);border-radius:12px;padding:16px}.step{margin-bottom:18px}.step b{font-size:11px;display:block;margin-bottom:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:10px}.chip.active{border-color:var(--p);color:var(--p);background:#f6f3ff}.upload{border:1px dashed #bbb;border-radius:9px;padding:15px;text-align:center;font-size:10px;display:block}.canvas{display:grid;place-items:center;background:#fafafd;border:1px solid var(--line);border-radius:12px;padding:30px}.previewcase{width:var(--cw);height:var(--ch);position:relative;border-radius:var(--cr);overflow:hidden;box-shadow:0 20px 30px #0002}.designart{position:absolute;inset:0;background-size:cover;background-position:center}.shellbase{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ct{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;text-shadow:0 2px 6px #0008}.cart{display:grid;grid-template-columns:1fr 300px;gap:18px}.cartitem{display:grid;grid-template-columns:70px 1fr 90px 85px;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.thumb{height:75px;background:#f7f7f8;border-radius:8px;display:grid;place-items:center}.qty{display:flex;gap:5px;align-items:center}.summary{height:max-content;position:sticky;top:85px}.line{display:flex;justify-content:space-between;margin:10px 0;font-size:12px}.total{font-size:19px;font-weight:900}.checkout{display:grid;grid-template-columns:1fr 300px;gap:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:700;display:block;margin-bottom:4px}.status{display:flex;margin:55px 0 35px}.stage{flex:1;text-align:center;position:relative}.stage:before{content:"";position:absolute;top:17px;left:0;right:0;height:3px;background:#ddd}.stage:first-child:before{left:50%}.stage:last-child:before{right:50%}.dot{position:relative;z-index:2;width:36px;height:36px;margin:auto;border-radius:50%;background:#ddd;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.stage.done .dot,.stage.current .dot{background:var(--p)}.stage small{font-size:10px;display:block;margin-top:8px}.success{padding:18px;border:1px solid #dcefe4;background:#f3fbf6;border-radius:12px}footer{border-top:1px solid var(--line);padding:25px 5%;color:#777;font-size:10px}@media(max-width:1000px){.products{grid-template-columns:repeat(3,1fr)}.customgrid{grid-template-columns:1fr}.cart,.checkout,.shopgrid{grid-template-columns:1fr}.summary{position:static}.hero{grid-template-columns:1fr;height:auto}.hero-cases{display:none}}@media(max-width:650px){.nav{display:none}.products{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
