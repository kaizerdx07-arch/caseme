<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASEME — Custom iPhone Cases</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f7f7fb;color:#17171c}.wrap{max-width:1200px;margin:auto;padding:30px}.hero{margin:24px auto;padding:60px 6%;min-height:380px;border-radius:28px;background:linear-gradient(120deg,#17171c,#35303f);color:#fff}.hero h1{font-size:clamp(44px,6vw,76px);line-height:.95;margin:15px 0}.hero p{max-width:560px;line-height:1.7;color:#ddd}.btn{display:inline-block;padding:13px 18px;border-radius:12px;background:#fff;color:#111;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.card{background:#fff;border:1px solid #e8e8ee;border-radius:20px;padding:20px}.muted{color:#777}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style></head><body><header class="wrap"><strong style="font-size:28px">CASEME</strong></header><main class="wrap"><section class="hero"><div class="muted" style="color:#cfc6ff">DESIGN YOUR STYLE</div><h1>Real-looking cases.<br>Made for <span style="color:#a99aff">your iPhone.</span></h1><p>Choose your exact iPhone model, shop ready-made cases, or create a custom design with your own photo.</p><a class="btn" href="#models">Shop Cases</a></section><section id="models"><h2>Choose your iPhone model</h2><div class="grid" id="modelGrid"></div></section></main><script>const MODELS=["iPhone 17 Pro Max","iPhone 17 Pro","iPhone Air","iPhone 17","iPhone 16 Pro Max","iPhone 16 Pro","iPhone 16 Plus","iPhone 16","iPhone 15 Pro Max","iPhone 15 Pro","iPhone 15 Plus","iPhone 15","iPhone 14 Pro Max","iPhone 14 Pro","iPhone 14 Plus","iPhone 14","iPhone 13 Pro Max","iPhone 13 Pro","iPhone 13 mini","iPhone 13","iPhone 12 Pro Max","iPhone 12 Pro","iPhone 12 mini","iPhone 12","iPhone 11 Pro Max","iPhone 11 Pro","iPhone 11"];document.getElementById('modelGrid').innerHTML=MODELS.map(m=>`<article class="card"><h3>${m}</h3><p class="muted">Model-specific CASEME cases</p><a class="btn" href="#models">View cases</a></article>`).join('');</script></body></html>
